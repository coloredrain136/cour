<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cour">
<meta name="theme-color" content="#0b0d1a">
<title>Cour</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://graphql.anilist.co">
<link rel="preconnect" href="https://s4.anilist.co">
<script>
/* Paint the saved theme before anything renders (no flash). */
try{var t=JSON.parse(localStorage.getItem('cour:themecss')||'null');if(t){var r=document.documentElement;for(var k in t)r.style.setProperty(k,t[k]);}}catch(e){}
</script>
<style>
/* ═════════════ TOKENS ═════════════
   Everything visual comes from these. Themes only change tokens. */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r-card:22px; --r-btn:16px; --r-sm:12px; --r-pill:999px;
  --base:#07080f;
  --wall:radial-gradient(120% 80% at 90% 0%,#5b3fd6 0%,transparent 55%),radial-gradient(90% 70% at 0% 100%,#b23a8a 0%,transparent 60%),radial-gradient(80% 60% at 20% 20%,#1d2a6b 0%,transparent 70%);
  --wall-filter:none; --wall-dim:0;
  --text:#f4f5fb; --text-2:rgba(244,245,251,.68); --text-3:rgba(244,245,251,.42);
  --accent:#8b7cff; --accent-ink:#fff; --accent-soft:rgba(139,124,255,.18);
  --card:rgba(255,255,255,.075); --card-2:rgba(255,255,255,.12);
  --chrome:rgba(22,20,40,.55); --sheet:rgba(20,18,34,.78);
  --stroke:rgba(255,255,255,.12); --stroke-2:rgba(255,255,255,.2);
  --hi:inset 0 1px 0 rgba(255,255,255,.16);
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --bf:blur(24px) saturate(170%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --good:#3ddc97; --warn:#ffb547; --bad:#ff6b6b;
  --tab-h:64px; --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
  --kb:0px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--base);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
img{display:block}
a{color:inherit;text-decoration:none}

/* ═════════════ BACKGROUND ═════════════ */
#bg{position:fixed;inset:-40px;background:var(--wall),var(--base);background-size:cover;background-position:center;filter:var(--wall-filter);transform:translateZ(0)}
#bg::after{content:"";position:absolute;inset:0;background:var(--base);opacity:var(--wall-dim)}

/* ═════════════ GLASS PRIMITIVES ═════════════ */
.card{position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-card);box-shadow:var(--hi),var(--shadow)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 38%);pointer-events:none}
.chrome{background:var(--chrome);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);border:1px solid var(--stroke);box-shadow:var(--hi),0 8px 28px rgba(0,0,0,.25)}

/* ═════════════ LAYOUT ═════════════ */
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 14px) var(--s4) calc(var(--tab-h) + var(--sb) + 40px);display:none}
.screen.on{display:block}
.screen.lib{padding-bottom:calc(var(--tab-h) + var(--sb) + 104px)}
.screen.srch{padding-bottom:calc(var(--tab-h) + var(--sb) + 110px + var(--kb))}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin:var(--s5) 2px var(--s4)}
.hdr h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:750}
.hdr .sub{color:var(--text-2);font-size:14px;margin-top:6px;font-weight:500}
.sec{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin:var(--s5) 4px var(--s2)}
.stack>*+*{margin-top:var(--s3)}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}

/* ═════════════ TAB BAR ═════════════ */
#tabs{position:fixed;left:var(--s3);right:var(--s3);bottom:calc(var(--sb) + 8px);height:var(--tab-h);border-radius:var(--r-pill);display:flex;padding:6px;z-index:30}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:var(--r-pill);color:var(--text-3);font-size:10.5px;font-weight:650;transition:color .2s,background .2s;position:relative}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--accent);background:var(--accent-soft)}
#tabs .dot{position:absolute;top:7px;right:calc(50% - 18px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;line-height:17px;font-weight:750;display:none}

/* ═════════════ BUTTONS ═════════════ */
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-btn);font-weight:650;font-size:16px;background:var(--card-2);border:1px solid var(--stroke);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 20px var(--accent-soft)}
.btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:var(--r-sm)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.danger{color:var(--bad)}
.btn svg{width:18px;height:18px}
.iconbtn{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;background:var(--card-2);border:1px solid var(--stroke)}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{transform:scale(.92)}

/* ═════════════ COVERS / RING ═════════════ */
.cov{border-radius:12px;object-fit:cover;background:var(--card-2);flex:none}
.ring{flex:none;position:relative;width:52px;height:52px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--stroke-2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .7s cubic-bezier(.2,.9,.2,1.15)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:750}

/* ═════════════ UP NEXT CARDS ═════════════ */
.nx{display:flex;align-items:center;gap:var(--s3);padding:10px 10px 10px 10px;transition:opacity .35s,transform .35s,max-height .45s,margin .45s,padding .45s;max-height:160px;overflow:hidden}
.nx .cov{width:64px;height:92px}
.nx .ring{width:46px;height:46px;align-self:flex-start;margin-top:4px}
.nx .mid{flex:1;min-width:0}
.nx .t{font-weight:700;font-size:16px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nx .m{font-size:13px;color:var(--text-2);margin-top:4px}
.nx .acts{display:flex;gap:8px;margin-top:10px}
.nx .acts .btn{height:38px;font-size:14px;padding:0 12px;border-radius:12px;gap:6px}
.nx .acts .btn svg{width:16px;height:16px}
.nx.gone{opacity:0;transform:translateX(30px) scale(.97);max-height:0;padding-top:0;padding-bottom:0;margin-top:0!important}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.n{background:var(--card-2);color:var(--text-2)}
.pill.w{background:rgba(255,181,71,.16);color:var(--warn)}

.inboxcard{display:flex;align-items:center;gap:var(--s3);padding:14px 16px}
.inboxcard .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.inboxcard .ic svg{width:22px;height:22px}
.inboxcard .cnt{margin-left:auto;min-width:28px;height:28px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 8px}

.soon{display:flex;gap:10px;overflow-x:auto;margin:0 calc(-1*var(--s4));padding:2px var(--s4) 6px;scrollbar-width:none}
.soon::-webkit-scrollbar{display:none}
.soon .card{flex:none;width:200px;padding:10px;display:flex;gap:10px;align-items:center}
.soon .cov{width:36px;height:52px;border-radius:8px}
.soon .t{font-size:13px;font-weight:650;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.soon .m{font-size:11.5px;color:var(--text-2);margin-top:3px}

.empty{text-align:center;padding:var(--s7) var(--s5) var(--s5)}
.empty .big{width:96px;height:96px;margin:0 auto var(--s4);border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);animation:pop .6s cubic-bezier(.2,.9,.2,1.3)}
.empty .big svg{width:48px;height:48px}
.empty h2{margin:0 0 6px;font-size:22px}
.empty p{margin:0;color:var(--text-2);font-size:15px;line-height:1.4}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

/* ═════════════ LIBRARY ═════════════ */
.fr{display:flex;gap:var(--s3);padding:10px;align-items:center;content-visibility:auto;contain-intrinsic-size:auto 96px}
.fr .cov{width:52px;height:74px;border-radius:10px}
.fr .mid{flex:1;min-width:0}
.fr .t{font-weight:680;font-size:15.5px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fr .m{font-size:12.5px;color:var(--text-2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:4px;border-radius:2px;background:var(--stroke-2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.stack-cov{position:relative;width:60px;height:80px;flex:none}
.stack-cov img{position:absolute;width:50px;height:72px;border-radius:9px;object-fit:cover;background:var(--card-2);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.stack-cov img:nth-child(1){left:0;top:6px;transform:rotate(-6deg);opacity:.7}
.stack-cov img:nth-child(2){left:10px;top:1px}
.chev{color:var(--text-3);width:18px;height:18px;flex:none}

#seg{position:fixed;left:var(--s3);right:var(--s3);bottom:calc(var(--sb) + var(--tab-h) + 16px);height:48px;border-radius:var(--r-pill);display:none;padding:4px;z-index:29;touch-action:none}
#seg.on{display:flex}
#seg .knob{position:absolute;top:4px;bottom:4px;border-radius:var(--r-pill);background:var(--accent);box-shadow:0 4px 14px var(--accent-soft);transition:transform .32s cubic-bezier(.3,1.2,.4,1),width .3s}
#seg button{flex:1;min-width:0;position:relative;z-index:1;font-size:11.5px;letter-spacing:-.01em;font-weight:700;color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:color .2s}
#seg button small{font-size:10px;opacity:.7;font-weight:650}
#seg button.on{color:var(--accent-ink)}

/* ═════════════ SEARCH ═════════════ */
#sbar{position:fixed;left:var(--s3);right:var(--s3);bottom:calc(var(--sb) + var(--tab-h) + 16px);height:52px;border-radius:var(--r-pill);display:none;align-items:center;gap:8px;padding:0 8px 0 16px;z-index:29;transition:transform .15s}
#sbar.on{display:flex}
body.kb #sbar{transform:translateY(calc(var(--tab-h) + var(--sb) + 8px - var(--kb)))}
#sbar svg{width:20px;height:20px;color:var(--text-3);flex:none}
#sbar input{flex:1;height:100%;background:none;border:0;outline:0;font-size:17px;min-width:0}
#sbar input::placeholder{color:var(--text-3)}
#sbar input::-webkit-search-cancel-button,#sbar input::-webkit-search-decoration{-webkit-appearance:none;display:none}
#sbar .x{width:32px;height:32px;border-radius:16px;display:none;place-items:center;background:var(--card-2)}
#sbar .x svg{width:14px;height:14px;color:var(--text-2)}
#sbar.has .x{display:grid}
.res{display:flex;gap:12px;align-items:center;padding:8px;content-visibility:auto;contain-intrinsic-size:auto 86px}
.res .cov{width:48px;height:68px;border-radius:9px}
.res .mid{flex:1;min-width:0}
.res .t{font-weight:680;font-size:15px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res .m{font-size:12.5px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .add{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.res .add svg{width:20px;height:20px}
.res .add.in{background:var(--card-2);color:var(--good)}

/* ═════════════ SHEETS ═════════════ */
#sheets{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .3s;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--st) - 24px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:var(--sheet);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);border:1px solid var(--stroke);border-bottom:0;box-shadow:var(--hi),0 -10px 40px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1);pointer-events:auto;will-change:transform}
.sheet.full{height:calc(100% - var(--st) - 24px)}
.sheet.in{transform:translateY(0)}
.scrim.in{opacity:1}
.grab{flex:none;padding:10px 0 4px;display:grid;place-items:center;touch-action:none}
.grab{position:relative}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--stroke-2)}
.sx{position:absolute;right:12px;top:10px;width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--stroke);color:var(--text-2);z-index:2}
.sx svg{width:16px;height:16px}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px var(--s4) calc(var(--sb) + 24px);overscroll-behavior:contain}
.sheet h2{margin:6px 2px 14px;font-size:24px;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px}
.row+.row{border-top:1px solid var(--stroke)}
.row .lbl{flex:1;font-weight:600}
.row .lbl small{display:block;font-weight:500;color:var(--text-2);font-size:12.5px;margin-top:2px}
.grp{padding:0;overflow:hidden}
.grp .row>.cov{width:40px;height:56px;border-radius:8px}

/* detail */
.hero{position:relative;margin:-4px calc(-1*var(--s4)) 0;padding:6px var(--s4) 16px;display:flex;gap:16px;align-items:flex-end}
.hero .cov{width:112px;height:160px;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.hero h2{margin:0 0 6px;font-size:22px;line-height:1.15}
.hero .alt{font-size:13px;color:var(--text-2);line-height:1.3}
.hero .meta{font-size:12.5px;color:var(--text-3);margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.prog{display:flex;align-items:center;gap:14px;padding:14px}
.prog .ring{width:68px;height:68px}
.prog .ring b{font-size:16px}
.prog .mid{flex:1;min-width:0}
.prog .big{font-size:20px;font-weight:750}
.prog .rel{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.35}
.step{display:flex;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--stroke);font-size:14px;font-weight:650;color:var(--text-2)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.segc{display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-pill);padding:3px}
.segc button{flex:1;height:34px;border-radius:var(--r-pill);font-size:14px;font-weight:700;color:var(--text-2);min-width:64px}
.segc button.on{background:var(--accent);color:var(--accent-ink)}
.stars{display:flex;gap:4px;touch-action:none}
.stars .st{position:relative;width:34px;height:34px}
.stars .st svg{position:absolute;inset:0;width:34px;height:34px}
.stars .st .bgs{color:var(--stroke-2)}
.stars .st .fg{position:absolute;inset:0;overflow:hidden;color:#ffc94d;width:0}
.stars.lg .st,.stars.lg .st svg{width:44px;height:44px}
.tog{width:52px;height:32px;border-radius:16px;background:var(--stroke-2);position:relative;transition:background .2s;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.tog.on{background:var(--good)}
.tog.on i{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:34px;text-align:center}

/* inbox */
.sg{padding:14px}
.sg .top{display:flex;gap:12px;align-items:center}
.sg .cov{width:44px;height:62px;border-radius:9px}
.sg .t{font-weight:700;line-height:1.25}
.sg .q{font-size:13.5px;color:var(--text-2);margin-top:3px;line-height:1.35}
.sg .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sg .acts .btn{flex:1;height:40px;font-size:13.5px;padding:0 8px;min-width:0}

/* themes */
.tgal{display:flex;gap:12px;overflow-x:auto;margin:0 calc(-1*var(--s4));padding:4px var(--s4) 8px;scrollbar-width:none}
.tgal::-webkit-scrollbar{display:none}
.tprev{flex:none;width:118px;text-align:center}
.tprev .pv{height:150px;border-radius:18px;position:relative;overflow:hidden;border:2px solid transparent;transition:transform .15s}
.tprev.on .pv{border-color:var(--accent)}
.tprev:active .pv{transform:scale(.96)}
.tprev .pv .c1,.tprev .pv .c2{position:absolute;left:10px;right:10px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
.tprev .pv .c1{top:14px;height:44px}
.tprev .pv .c2{top:66px;height:30px}
.tprev .pv .ac{position:absolute;left:10px;bottom:12px;width:54px;height:22px;border-radius:11px}
.tprev .pv .rg{position:absolute;right:12px;bottom:10px;width:26px;height:26px;border-radius:50%;border:4px solid}
.tprev span{display:block;font-size:12.5px;font-weight:650;margin-top:6px;color:var(--text-2)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:18px;border:3px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sw.on{border-color:var(--text)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--stroke-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.field{width:100%;height:48px;border-radius:var(--r-sm);background:var(--card);border:1px solid var(--stroke);padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--accent)}

/* lock */
#lock{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:var(--s5)}
#lock.on{display:flex}
#lock .card{width:100%;max-width:360px;padding:28px 22px;text-align:center}
#lock img{width:72px;height:72px;border-radius:18px;margin:0 auto 14px}
#lock h1{margin:0 0 6px;font-size:28px}
#lock p{margin:0 0 18px;color:var(--text-2)}
#lock .err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translate(-50%,-20px);opacity:0;z-index:90;padding:0 8px 0 18px;height:48px;border-radius:24px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;transition:all .3s cubic-bezier(.2,.9,.25,1.1);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{height:36px;padding:0 14px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-weight:750}
#toast.noact{padding-right:18px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--good);margin-left:6px;vertical-align:middle;transition:background .3s}
.syncdot.busy{background:var(--warn);animation:blink 1s infinite}
.syncdot.off{background:var(--text-3)}
#updbar{white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:95;height:44px;padding:0 20px;border-radius:22px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@keyframes blink{50%{opacity:.35}}
.progbar{height:8px;border-radius:4px;background:var(--stroke-2);overflow:hidden;margin:14px 0 8px}
.progbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

<script>
'use strict';
/* ═══════════════════════ UTIL ═══════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const pad = (n) => String(n).padStart(2, '0');
const nowMs = () => Date.now();
const iso = () => new Date().toISOString();
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const APP_VERSION = 'cour-3';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = (Math.random() * 16) | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); }));
const norm = (s) => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9぀-ヿ一-鿿]+/g, ' ').trim();

function rel(t) { // "in 2d 4h" / "3h ago"
  const d = new Date(t).getTime() - nowMs(), a = Math.abs(d);
  const m = Math.round(a / 6e4), h = Math.floor(a / 36e5), dd = Math.floor(a / 864e5);
  const s = a < 36e5 ? `${Math.max(1, m)}m` : a < 864e5 ? `${h}h` : `${dd}d ${Math.floor((a % 864e5) / 36e5)}h`;
  return d >= 0 ? `in ${s}` : `${s} ago`;
}
function when(t) {
  const d = new Date(t);
  return d.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' });
}
function ago(t) {
  if (!t) return 'never';
  const days = Math.floor((nowMs() - new Date(t).getTime()) / 864e5);
  if (days < 1) return 'today';
  if (days < 2) return 'yesterday';
  if (days < 14) return `${days} days ago`;
  if (days < 60) return `${Math.round(days / 7)} weeks ago`;
  return `${Math.round(days / 30)} months ago`;
}

/* ═══════════════════════ ICONS ═══════════════════════ */
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor"/></svg>',
  lib: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4L2.8 9.5l6.4-.8z"/></svg>',
  sparkle: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9zM19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  paint: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="7.5" r="1.3" fill="currentColor"/><circle cx="16" cy="10" r="1.3" fill="currentColor"/><path d="M12 21a3 3 0 0 1 0-6h2"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  pc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
};

/* ═══════════════════════ STATE ═══════════════════════ */
const STATUS = [['watching', 'Watching'], ['completed', 'Completed'], ['on_hold', 'On Hold'], ['dropped', 'Dropped'], ['plan', 'Plan']];
const STATUS_NAME = Object.fromEntries(STATUS);
const S = {
  shows: new Map(),
  sugg: [],
  settings: {},
  tab: LS.get('cour:tab', 'home'),
  lib: LS.get('cour:lib', 'watching'),
  loaded: false,
  syncing: false,
};
const setting = (k, d) => (S.settings[k] === undefined ? d : S.settings[k]);
const title = (s) => s.title_en || s.title_romaji || s.title_native || 'Untitled';
const altTitle = (s) => { const t = title(s); return [s.title_romaji, s.title_native].filter((x) => x && x !== t).join(' · '); };

/* ═══════════════════════ LOCAL CACHE ═══════════════════════ */
let cacheT;
function saveCache() {
  clearTimeout(cacheT);
  cacheT = setTimeout(() => LS.set('cour:cache', { shows: [...S.shows.values()], sugg: S.sugg, settings: S.settings }), 150);
}
function loadCache() {
  const c = LS.get('cour:cache', null);
  if (!c) return false;
  S.shows = new Map((c.shows || []).map((s) => [s.anilist_id, s]));
  S.sugg = c.sugg || [];
  S.settings = c.settings || {};
  return true;
}

/* ═══════════════════════ SERVER ═══════════════════════ */
const KEY = () => LS.get('cour:key', null);
async function api(body) {
  const r = await fetch('/api/db', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-cour-key': KEY() || '' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'Bad response from server (' + r.status + ')' }));
  if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
  return j;
}

// Every write goes through an outbox: instant locally, retried until the server has it (works offline at work).
let outbox = LS.get('cour:outbox', []);
let flushing = false;
function queue(op) { outbox.push(op); LS.set('cour:outbox', outbox); flush(); }
async function flush() {
  if (flushing || !KEY()) return;
  flushing = true; syncDot();
  try {
    while (outbox.length) {
      const op = outbox[0];
      try { await api(op); }
      catch (e) {
        if (e.status === 401) { lock(); break; }
        if (!e.status || e.status >= 500 || e.status === 429) break; // network/server hiccup → retry later
        console.warn('Dropped write', e.message, op); // 4xx = bad write (e.g. duplicate inbox item) → skip it
      }
      outbox.shift(); LS.set('cour:outbox', outbox);
    }
  } finally { flushing = false; syncDot(); }
}
setInterval(() => outbox.length && flush(), 15000);
addEventListener('online', flush);

function reapplyOutbox() {
  for (const op of outbox) {
    if (op.table === 'shows' && op.method === 'PATCH') {
      const id = Number(String(op.query).split('eq.')[1]);
      const s = S.shows.get(id); if (s) Object.assign(s, op.body);
    } else if (op.table === 'shows' && op.method === 'POST') {
      for (const r of op.body) S.shows.set(r.anilist_id, Object.assign(S.shows.get(r.anilist_id) || {}, r));
    } else if (op.table === 'shows' && op.method === 'DELETE') {
      S.shows.delete(Number(String(op.query).split('eq.')[1]));
    } else if (op.table === 'suggestions' && op.method === 'PATCH') {
      const id = String(op.query).split('eq.')[1]; S.sugg = S.sugg.filter((x) => x.id !== id);
    } else if (op.table === 'suggestions' && op.method === 'POST') {
      for (const r of op.body) if (!S.sugg.find((x) => x.id === r.id)) S.sugg.push(r);
    } else if (op.table === 'settings' && op.method === 'POST') {
      for (const r of op.body) S.settings[r.key] = r.value;
    }
  }
}

function syncDot() {
  const d = $('#syncdot'); if (!d) return;
  d.className = 'syncdot' + (flushing || S.syncing ? ' busy' : outbox.length ? ' off' : '');
}

/* ─── write helpers ─── */
function patchShow(id, f, opts = {}) {
  const s = S.shows.get(id); if (!s) return;
  Object.assign(s, f, { updated_at: iso() });
  saveCache();
  queue({ table: 'shows', method: 'PATCH', query: 'anilist_id=eq.' + id, body: f, prefer: 'return=minimal' });
  if (!opts.silent) render();
}
function upsertRows(rows) {
  if (!rows.length) return;
  // PostgREST bulk upserts need identical keys per batch → group by key signature
  const groups = new Map();
  for (const r of rows) { const sig = Object.keys(r).sort().join(','); (groups.get(sig) || groups.set(sig, []).get(sig)).push(r); }
  for (const g of groups.values())
    for (let i = 0; i < g.length; i += 150)
      queue({ table: 'shows', method: 'POST', body: g.slice(i, i + 150), prefer: 'resolution=merge-duplicates,return=minimal' });
}
function putShows(rows) {
  for (const r of rows) S.shows.set(r.anilist_id, Object.assign(S.shows.get(r.anilist_id) || {}, r));
  saveCache(); upsertRows(rows);
}
function deleteShow(id) {
  S.shows.delete(id);
  S.sugg = S.sugg.filter((x) => x.show_id !== id);
  saveCache();
  queue({ table: 'shows', method: 'DELETE', query: 'anilist_id=eq.' + id, prefer: 'return=minimal' });
}
function setSetting(key, value) {
  S.settings[key] = value; saveCache();
  queue({ table: 'settings', method: 'POST', body: [{ key, value }], prefer: 'resolution=merge-duplicates,return=minimal' });
}
function addSugg(show_id, kind, payload = {}) {
  if (S.sugg.some((x) => x.show_id === show_id && x.kind === kind)) return;
  const row = { id: uuid(), show_id, kind, payload, status: 'pending', source: 'app', created_at: iso() };
  S.sugg.push(row); saveCache();
  queue({ table: 'suggestions', method: 'POST', body: [row], prefer: 'return=minimal' });
}
function resolveSugg(id, status) {
  S.sugg = S.sugg.filter((x) => x.id !== id); saveCache();
  queue({ table: 'suggestions', method: 'PATCH', query: 'id=eq.' + id, body: { status, resolved_at: iso() }, prefer: 'return=minimal' });
}

/* ═══════════════════════ ANILIST ═══════════════════════ */
const ANI = 'https://graphql.anilist.co';
const MF = 'id idMal title{english romaji native} synonyms coverImage{medium large color} format episodes status seasonYear startDate{year month day} nextAiringEpisode{episode airingAt} relations{edges{relationType node{id type}}} externalLinks{site url}';
async function ani(query, variables, tries = 0) {
  const r = await fetch(ANI, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query, variables }) });
  if (r.status === 429 && tries < 4) { await sleep((+r.headers.get('Retry-After') || 20) * 1000 + 500); return ani(query, variables, tries + 1); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || (j.errors && !j.data)) throw new Error((j.errors && j.errors[0] && j.errors[0].message) || 'AniList ' + r.status);
  return j.data;
}
async function aniBatch(field, ids, onProg) {
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const d = await ani(`query($ids:[Int]){Page(perPage:50){media(${field}:$ids,type:ANIME){${MF}}}}`, { ids: ids.slice(i, i + 50) });
    out.push(...d.Page.media);
    onProg && onProg(Math.min(i + 50, ids.length), ids.length);
    if (i + 50 < ids.length) await sleep(900);
  }
  return out;
}
async function aniSearch(q) {
  const d = await ani(`query($q:String){Page(perPage:25){media(search:$q,type:ANIME,sort:SEARCH_MATCH,isAdult:false){${MF}}}}`, { q });
  return d.Page.media;
}
function metaFrom(m, cur) {
  const sd = m.startDate || {};
  const cr = (m.externalLinks || []).find((l) => /crunchyroll/i.test(l.site));
  return {
    anilist_id: m.id,
    mal_id: m.idMal || null,
    title_en: m.title.english || null,
    title_romaji: m.title.romaji || null,
    title_native: m.title.native || null,
    synonyms: (m.synonyms || []).slice(0, 8),
    cover: (m.coverImage && m.coverImage.medium) || null,
    cover_lg: (m.coverImage && m.coverImage.large) || null,
    cover_color: (m.coverImage && m.coverImage.color) || null,
    format: m.format || null,
    total_eps: m.episodes || null,
    airing_status: m.status || null,
    season_year: m.seasonYear || sd.year || null,
    start_date: sd.year ? `${sd.year}-${pad(sd.month || 1)}-${pad(sd.day || 1)}` : null,
    relations: ((m.relations && m.relations.edges) || []).filter((e) => e.node.type === 'ANIME' && (e.relationType === 'PREQUEL' || e.relationType === 'SEQUEL')).map((e) => e.node.id),
    sub_next_ep: (m.nextAiringEpisode && m.nextAiringEpisode.episode) || null,
    sub_next_at: m.nextAiringEpisode ? new Date(m.nextAiringEpisode.airingAt * 1000).toISOString() : null,
    cr_url: (cur && cur.cr_url) || (cr ? cr.url : null),
    meta_updated_at: iso(),
  };
}
const mediaCache = new Map(); // anilist media seen in search/related, for previews

/* ═══════════════════════ RELEASES ═══════════════════════ */
function subAvail(s) {
  const st = s.airing_status;
  if (st === 'RELEASING' || st === 'HIATUS') return s.sub_next_ep ? s.sub_next_ep - 1 : (s.total_eps ?? null);
  if (st === 'NOT_YET_RELEASED') return 0;
  return s.total_eps ?? null; // FINISHED / CANCELLED
}
const dubActive = (s) => s.dub_next_at && new Date(s.dub_next_at).getTime() > nowMs() - 10 * 864e5;
function dubAvail(s) {
  if (s.dub_latest_ep != null) {
    if (dubActive(s) || s.airing_status !== 'FINISHED') return s.dub_latest_ep;
    return Math.max(s.dub_latest_ep, s.total_eps || 0);
  }
  if (s.airing_status === 'FINISHED' || s.airing_status === 'CANCELLED') return s.total_eps ?? null;
  if (s.airing_status === 'NOT_YET_RELEASED') return 0;
  return null; // airing, no dub info
}
const avail = (s) => (s.lang === 'sub' ? subAvail(s) : dubAvail(s));
function nextRel(s) {
  const ep = s.lang === 'sub' ? s.sub_next_ep : s.dub_next_ep;
  const at = s.lang === 'sub' ? s.sub_next_at : s.dub_next_at;
  return at && new Date(at).getTime() > nowMs() ? { ep, at } : null;
}
const behind = (s) => { const a = avail(s); return a == null ? 0 : Math.max(0, a - (s.eps_watched || 0)); };

/* ═══════════════════════ FRANCHISES ═══════════════════════ */
const byStart = (a, b) => (a.start_date || '9999').localeCompare(b.start_date || '9999') || a.anilist_id - b.anilist_id;
function recomputeFranchises() {
  const parent = new Map([...S.shows.keys()].map((i) => [i, i]));
  const find = (x) => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const s of S.shows.values())
    for (const r of s.relations || []) if (parent.has(r)) { const a = find(s.anilist_id), b = find(r); if (a !== b) parent.set(a, b); }
  const groups = new Map();
  for (const id of parent.keys()) { const r = find(id); (groups.get(r) || groups.set(r, []).get(r)).push(S.shows.get(id)); }
  const changes = [];
  for (const g of groups.values()) {
    g.sort(byStart);
    const key = g[0].anilist_id;
    for (const s of g) if (s.franchise_key !== key) { s.franchise_key = key; changes.push({ anilist_id: s.anilist_id, franchise_key: key }); }
  }
  if (changes.length) { saveCache(); upsertRows(changes); }
}
const franchise = (s) => [...S.shows.values()].filter((x) => (x.franchise_key ?? x.anilist_id) === (s.franchise_key ?? s.anilist_id)).sort(byStart);

async function answerSugg(sgId, v) {

  if (v === 'hold') { patchShow(id, { status: 'on_hold' }, { silent: true }); toast('Put on hold'); }
  if (v === 'drop') { patchShow(id, { status: 'dropped' }, { silent: true }); toast('Dropped'); setTimeout(() => cleanupSheet(id), 450); }
  if (v === 'never') { patchShow(id, { never_nag: true }, { silent: true }); toast("Won't ask about this one again"); }

  if (v === 'rate' && s) setTimeout(() => finishSheet(id, true), 350);

    try {
      let m = mediaCache.get(id);
      if (!m) { m = (await ani(`query($id:Int){Media(id:$id,type:ANIME){${MF}}}`, { id })).Media; mediaCache.set(id, m); }

    } catch (e) { return toast('Could not add: ' + e.message); }
  }
  resolveSugg(sgId, ['ignore'].includes(v) ? 'rejected' : 'accepted');
  render();
}

function malStatus(v) {
  const s = String(v).toLowerCase().trim();
  return { watching: 'watching', 1: 'watching', completed: 'completed', 2: 'completed', 'on-hold': 'on_hold', 'on hold': 'on_hold', 3: 'on_hold', dropped: 'dropped', 4: 'dropped', 'plan to watch': 'plan', 6: 'plan' }[s] || 'plan';
}
const malDate = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v) && !v.startsWith('0000') ? v.replace(/-00/g, '-01') : null);
async function readMal(file) {
  let buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    if (!('DecompressionStream' in window)) throw new Error('Unzip the .gz file first, then pick the .xml.');
    buf = new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  const doc = new DOMParser().parseFromString(new TextDecoder().decode(buf), 'text/xml');
  const an = [...doc.getElementsByTagName('anime')];
  if (!an.length) throw new Error("That doesn't look like a MyAnimeList anime export.");
  const v = (el, t) => { const x = el.getElementsByTagName(t)[0]; return x ? x.textContent.trim() : ''; };
  return an.map((el) => ({
    mal_id: Number(v(el, 'series_animedb_id')), title: v(el, 'series_title'),
    watched: Number(v(el, 'my_watched_episodes')) || 0, score: Number(v(el, 'my_score')) || 0,
    status: malStatus(v(el, 'my_status')), start: malDate(v(el, 'my_start_date')), finish: malDate(v(el, 'my_finish_date')),
  })).filter((x) => x.mal_id);
}

      rows.push(r);
    }
    putShows(rows); recomputeFranchises(); staleCheck(); render();
    o.state = { step: 'done', added: rows.length, missed }; refreshSheet(o);
    refreshDub(true).catch(() => {});
  };
}

async function exportJSON() {

  const name = `cour-backup-${today()}.json`;

/* ═══════════════════════ RELEASE DATA REFRESH ═══════════════════════ */
async function refreshMeta(force) {
  if (!force && nowMs() - LS.get('cour:metaAt', 0) < 6 * 36e5) return;
  const ids = [...S.shows.values()].filter((s) => ['watching', 'on_hold', 'plan'].includes(s.status) && (force || s.airing_status !== 'FINISHED' || !s.meta_updated_at || s.status === 'watching' && !s.total_eps)).map((s) => s.anilist_id);
  if (ids.length) {
    const media = await aniBatch('id_in', ids);
    const rows = [];
    for (const m of media) {
      const cur = S.shows.get(m.id); if (!cur) continue;
      const meta = metaFrom(m, cur);
      const changed = ['total_eps', 'airing_status', 'sub_next_ep', 'sub_next_at', 'cover', 'title_en', 'cr_url'].some((k) => String(meta[k]) !== String(cur[k]));
      if (changed || force) rows.push(meta);
    }
    if (rows.length) { putShows(rows); recomputeFranchises(); }
  }
  LS.set('cour:metaAt', nowMs());
  render();
}
const schedH = () => ({ 'x-cour-key': KEY() || '' });
async function lookupSched(ids) {

  if (!ids.length) return;
  try {
    const j = await fetch('/api/schedule?op=lookup&anilist=' + ids.join(','), { headers: schedH() }).then((r) => r.json());
    if (j.disabled) { S.schedOff = true; return; }
    for (const id of ids) {
      const m = j.map && j.map[id], s = S.shows.get(id); if (!s) continue;
      const f = { sched_route: m && m.route ? m.route : '-' };

}
async function refreshDub(force) {

  if (!shows.length) return;
  const j = await fetch('/api/schedule?op=timetable', { headers: schedH() }).then((r) => r.json());
  if (j.disabled) { S.schedOff = true; return; }

  }
  for (const s of shows) {
    let route = s.sched_route && s.sched_route !== '-' ? s.sched_route : null;
    if (!route || !byRoute.has(route)) route = [s.title_en, s.title_romaji].map((t) => byTitle.get(norm(t))).find(Boolean) || route;
    const es = route && byRoute.get(route); if (!es) continue;
    let latest = null, next = null;
    for (const e of es) {
      let ep = Number(e.ep); if (!ep) continue;
      if (s.total_eps && ep > s.total_eps && e.sub > 0 && e.sub <= s.total_eps) ep = e.sub;
      const at = e.delayedUntil && new Date(e.delayedUntil) > new Date(e.at) ? e.delayedUntil : e.at;
      const t = new Date(at).getTime();
      if (t <= nowMs()) latest = Math.max(latest ?? 0, ep); else if (!next || t < next.t) next = { ep, t };
    }
    const f = {};
    if (latest != null && latest > (s.dub_latest_ep || 0)) f.dub_latest_ep = latest;
    const nAt = next ? new Date(next.t).toISOString() : null;
    if (next && (s.dub_next_ep !== next.ep || s.dub_next_at !== nAt)) { f.dub_next_ep = next.ep; f.dub_next_at = nAt; }
    if (route !== s.sched_route) f.sched_route = route;
    if (Object.keys(f).length) patchShow(s.anilist_id, f, { silent: true });
  }
  LS.set('cour:dubAt', nowMs());
  render();
}

/* ═══════════════════════ LOCK / TOAST / SYNC ═══════════════════════ */
function lock() { $('#lock').classList.add('on'); }
async function unlock() {
  const v = $('#pass').value.trim(); if (!v) return;
  LS.set('cour:key', v); $('#lockerr').textContent = '';
  try { await api({ op: 'ping' }); $('#lock').classList.remove('on'); $('#pass').value = ''; $('#pass').blur(); sync(); }
  catch (e) { LS.del('cour:key'); $('#lockerr').textContent = e.status === 401 ? "That passcode didn't match." : e.message; }
}
let toastT;
function toast(msg, act, fn) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${act ? `<button>${esc(act)}</button>` : ''}`;
  t.classList.toggle('noact', !act);
  if (act) t.querySelector('button').onclick = () => { fn(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), act ? 4500 : 2400);
}
let lastSync = 0;
async function sync() {
  if (S.syncing || !KEY()) return;
  S.syncing = true; syncDot(); lastSync = nowMs();
  try {
    await flush();
    const j = await api({ op: 'load' });
    S.shows = new Map((j.shows || []).map((s) => [s.anilist_id, s]));
    S.sugg = j.suggestions || [];
    S.settings = Object.fromEntries((j.settings || []).map((x) => [x.key, x.value]));
    reapplyOutbox();
    S.loaded = true; recomputeFranchises(); saveCache(); applyTheme(); render();
    staleCheck(); render();
    syncNews();
    if (j.version && j.version !== APP_VERSION) showUpdate();
    refreshMeta().catch((e) => console.warn('meta', e)).finally(() => refreshDub().catch((e) => console.warn('dub', e)));
  } catch (e) {
    if (e.status === 401) lock();
    else if (e.status) toast(e.message);
  } finally { S.syncing = false; syncDot(); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && nowMs() - lastSync > 60000) sync(); });

/* ═══════════════════════ EVENTS ═══════════════════════ */
const ACT = {
  tab: (el) => setTab(el.dataset.tab),
  lib: (el) => setLib(el.dataset.st),
  open: (el, id) => openDetail(id),
  preview: (el, id) => openAny(id),
  openfr: (el, id) => openFranchise(id),
  plus1: (el, id) => plus1(id),
  minus1: (el, id) => { const s = S.shows.get(id); if (s && s.eps_watched > 0) patchShow(id, { eps_watched: s.eps_watched - 1 }); },
  status: (el, id) => setStatus(id, el.dataset.st),
  rate: (el, id, e) => { const s = S.shows.get(id); const v = starVal(el, e); patchShow(id, { rating: Number(s.rating) === v ? null : v }); },
  frate: (el, id, e) => { const o = sheets[sheets.length - 1]; const v = starVal(el, e); o.setVal(o.getVal() === v ? 0 : v); },
  finishsave: (el, id) => {
    const o = sheets[sheets.length - 1], v = o.getVal(), s = S.shows.get(id);
    const f = { rating: v || null };
    if (!o.already) { f.status = 'completed'; f.completed_at = today(); if (s.total_eps) f.eps_watched = s.total_eps; }
    patchShow(id, f); closeSheet(o); toast(o.already ? (v ? 'Rated ' + v + ' ★' : 'Saved') : 'Completed' + (v ? ' · ' + v + ' ★' : ''));
  },
  lang: (el, id) => patchShow(id, { lang: el.dataset.v }),
  crq: (el, id) => { patchShow(id, { cr_cleanup: 'queued', cr_cleanup_at: iso(), cr_cleanup_note: null }); closeSheet(sheets.find((o) => o.kind === 'cleanup')); toast('Muse will clear it tonight'); refreshSheets(); },
  crcopy: async (el, id) => {
    const s = S.shows.get(id); const txt = cleanupPrompt(s);
    try { await navigator.clipboard.writeText(txt); toast('Copied. Paste it into Muse'); }
    catch { const o = openSheet(`<h2>Copy this into Muse</h2><textarea class="field" style="height:180px" readonly>${esc(txt)}</textarea>`); setTimeout(() => { const t = o.sh.querySelector('textarea'); t.focus(); t.select(); }, 350); return; }
    closeSheet(sheets.find((o) => o.kind === 'cleanup'));
  },
  crrow: (el, id) => { const s = S.shows.get(id); if (s.cr_cleanup === 'queued') { patchShow(id, { cr_cleanup: null }); toast('Cancelled'); refreshSheets(); } else cleanupSheet(id); },
  nag: (el, id) => { const s = S.shows.get(id); patchShow(id, { never_nag: !s.never_nag }); },
  editlink: (el, id) => {
    const s = S.shows.get(id);
    const o = openSheet(`<h2>Crunchyroll link</h2><p class="muted" style="margin:-6px 2px 14px;font-size:14px">Paste the show's page from the Crunchyroll app (Share → Copy Link).</p><input class="field" id="crurl" type="url" placeholder="https://www.crunchyroll.com/series/…" value="${esc(s.cr_url || '')}"><div class="stack" style="margin-top:12px"><button class="btn pri block" data-act="savelink" data-id="${id}">Save</button><button class="btn ghost block" data-act="closesheet">Cancel</button></div>`);
    setTimeout(() => o.sh.querySelector('#crurl').focus(), 350);
  },
  savelink: (el, id) => { const v = $('#crurl').value.trim(); if (v && !/^https?:\/\//.test(v)) return toast('That needs to be a full link'); patchShow(id, { cr_url: v || null }); closeSheet(); },
  remove: (el, id) => {
    const o = sheets.find((x) => x.kind === 'detail' && x.id === id);
    if (o && !o.confirmRemove) { o.confirmRemove = true; refreshSheet(o); setTimeout(() => { if (o.confirmRemove) { o.confirmRemove = false; sheets.includes(o) && refreshSheet(o); } }, 3000); return; }
    const s = S.shows.get(id); const backup = { ...s };
    deleteShow(id); closeSheet(o); recomputeFranchises(); render();
    toast('Removed', 'Undo', () => { putShows([backup]); recomputeFranchises(); render(); });
  },
  add: (el, id) => { addShow(id, el.dataset.st); },
  quickadd: (el, id) => { addShow(id, 'plan'); renderSearch(); },
  inbox: () => openInbox(),
  sg: (el) => answerSugg(el.dataset.sg, el.dataset.v),
  closesheet: (el) => closeSheet(sheets.find((o) => o.sh.contains(el)) || sheets[sheets.length - 1]),
  clearq: () => { $('#q').value = ''; onQ(); $('#q').focus(); },
  import: () => openImport(),
  impgo: () => { const o = sheets.find((x) => x.kind === 'import'); o && o.run(); },
  export: () => exportJSON(),
  refresh: async (el) => { toast('Refreshing…'); try { await refreshMeta(true); await refreshDub(true); toast('Release data updated'); } catch (e) { toast('Refresh failed: ' + e.message); } },
  staledays: (el) => { setSetting('stale_days', Number(el.dataset.v)); renderSettings(); },
  deflang: (el) => { setSetting('default_lang', el.dataset.v); renderSettings(); },
  lockdevice: () => { LS.del('cour:key'); LS.del('cour:cache'); S.shows.clear(); S.sugg = []; render(); lock(); },
  unlock: () => unlock(),
  themeedit: () => openThemeEditor(),
  pickt: (el) => {
    if (el.dataset.kind === 'preset') { const p = PRESETS.find((x) => x.id === el.dataset.v); const cur = theme(); setTheme({ preset: p.id, name: p.name, accent: null, id: null, wall: cur.wall.type === 'photo' ? { type: 'gradient' } : cur.wall }); }
    else { const c = setting('custom_themes', []).find((x) => x.id === el.dataset.v); if (c) setTheme({ ...c }); }
  },
  tset: (el) => {
    const k = el.dataset.k;
    if (k === 'accentFromWall') { const o = sheets.find((x) => x.kind === 'theme'); const a = o && o.wallAccent; if (a) setTheme({ accent: a, accentFromWall: true }); else toast('Pick a photo first'); }
    else setTheme({ [k]: el.dataset.v });
    refreshSheets();
  },
  twall: (el) => { setTheme({ wall: { type: el.dataset.v } }); refreshSheets(); },
  tsave: () => {
    const name = ($('#tname').value || '').trim() || 'My theme';
    const list = setting('custom_themes', []).slice(); const t = theme();
    const ex = t.id && list.find((x) => x.id === t.id);
    const saved = { ...t, name, id: ex ? t.id : uuid() };
    if (ex) list[list.indexOf(ex)] = saved; else list.push(saved);
    setSetting('custom_themes', list); setTheme(saved); refreshSheets(); toast(`Saved “${name}”`);
  },
  tdel: (el) => { setSetting('custom_themes', setting('custom_themes', []).filter((x) => x.id !== el.dataset.v)); if (theme().id === el.dataset.v) setTheme({ id: null }); refreshSheets(); renderSettings(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, Number(el.dataset.id), e);
});
$('#q').addEventListener('input', onQ);
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#q').blur(); } });
$('#pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
if (window.visualViewport) {
  const vv = visualViewport;
  const upd = () => { const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop); document.documentElement.style.setProperty('--kb', kb + 'px'); document.body.classList.toggle('kb', kb > 80); };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
}

/* ═══════════════════════ BOOT ═══════════════════════ */

/* ─── nightly sync news + update banner ─── */
function syncNews() {
  const sy = setting('sync', null), lr = sy && sy.last_result;
  if (!sy || !sy.last_run || sy.last_run <= LS.get('cour:seenSync', '')) return;
  LS.set('cour:seenSync', sy.last_run);
  if (sy.needs_login) return toast('Sync needs a Crunchyroll login', 'See', () => setTab('settings'));
  const n = lr ? (lr.updated || []).length + (lr.added || []).length : 0;
  if (n) toast(`Muse updated ${n} show${n === 1 ? '' : 's'}`, 'See', () => setTab('settings'));
}
let updShown = false;
function showUpdate() {
  if (updShown) return; updShown = true;
  const b = document.createElement('button');
  b.id = 'updbar'; b.textContent = 'Update ready · tap to reload';
  b.onclick = () => location.reload();
  document.body.appendChild(b);
}
async function checkVersion() {
  try {
    const j = await fetch('/version.json?t=' + nowMs(), { cache: 'no-store' }).then((r) => r.json());
    if (j.version && j.version !== APP_VERSION) showUpdate();
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
setInterval(checkVersion, 15 * 60e3);

(function boot() {
  loadCache();
  applyTheme();
  renderTabs();
  render();
  setTab(S.tab === 'search' ? 'home' : S.tab, { nofocus: true });
  if (!KEY()) return lock();
  sync();
})();

</script>
